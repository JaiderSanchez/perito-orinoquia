services:
  - type: web
    name: perito-orinoquia-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Perito Orinoquia
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: perito-orinoquia-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: perito-orinoquia-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: perito-orinoquia-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: perito-orinoquia-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: perito-orinoquia-db
          property: password
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: perito-orinoquia-db
    plan: free
    databaseName: perito_orinoquia
    user: perito_orinoquia
